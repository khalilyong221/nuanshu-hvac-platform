<title>暖枢面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface: #f3eee1; --surface-raised: #ffffff; --surface-sunken: #e2e7dd; --surface-inset: #d8ded1;
    --ink: #16211c; --ink-muted: #52625a; --ink-faint: #8b988e;
    --border: #d1d8c9; --border-strong: #b7c1af;
    --brass: #93641f; --brass-ink: #6e4a17; --brass-soft: #ecdcb8; --brass-soft-ink: #6e4a17;
    --frost: #2c748a; --frost-soft: #d1e7ea;
    --good: #2c7a4b; --good-soft: #d7ead9; --warn: #a4720a; --warn-soft: #f2e0b3;
    --critical: #a63a24; --critical-soft: #f4d9cd;
    --shadow-soft: 0 1px 2px rgba(20,30,22,0.06), 0 6px 18px -8px rgba(20,30,22,0.18);
    --shadow-raised: 0 4px 10px rgba(20,30,22,0.10), 0 16px 40px -12px rgba(20,30,22,0.28);
    --font-display: 'Oswald', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-body: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radius-s: 8px; --radius-m: 14px; --radius-l: 22px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface: #0f1c17; --surface-raised: #16261f; --surface-sunken: #0a1511; --surface-inset: #0a1511;
      --ink: #eef2ec; --ink-muted: #a3b3a8; --ink-faint: #6c7d72;
      --border: #253630; --border-strong: #34473f;
      --brass: #d6a95f; --brass-ink: #f0d9ab; --brass-soft: #3a2e17; --brass-soft-ink: #e8c98a;
      --frost: #7fc2d6; --frost-soft: #163137;
      --good: #5cc48c; --good-soft: #163728; --warn: #e3b544; --warn-soft: #3a2e10;
      --critical: #e57a5c; --critical-soft: #3a1f16;
      --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px -8px rgba(0,0,0,0.5);
      --shadow-raised: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --surface: #0f1c17; --surface-raised: #16261f; --surface-sunken: #0a1511; --surface-inset: #0a1511;
    --ink: #eef2ec; --ink-muted: #a3b3a8; --ink-faint: #6c7d72;
    --border: #253630; --border-strong: #34473f;
    --brass: #d6a95f; --brass-ink: #f0d9ab; --brass-soft: #3a2e17; --brass-soft-ink: #e8c98a;
    --frost: #7fc2d6; --frost-soft: #163137;
    --good: #5cc48c; --good-soft: #163728; --warn: #e3b544; --warn-soft: #3a2e10;
    --critical: #e57a5c; --critical-soft: #3a1f16;
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px -8px rgba(0,0,0,0.5);
    --shadow-raised: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  body{ background: var(--surface); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; }
  .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button{ font-family: inherit; }
  ::selection{ background: var(--brass-soft); color: var(--brass-ink); }
  a{ color: var(--frost); }
  :focus-visible{ outline: 2px solid var(--frost); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .shell{ max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }

  .nameplate{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap: wrap;
    background: linear-gradient(155deg, var(--surface-raised), var(--surface-sunken));
    border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px 24px;
    box-shadow: var(--shadow-soft); position: relative; overflow: hidden;
  }
  .nameplate::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, rgba(147,100,31,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .brandmark{ display:flex; align-items:center; gap:14px; position:relative; }
  .brand-badge{
    width:46px; height:46px; border-radius:12px;
    background: conic-gradient(from 220deg, var(--frost), var(--brass), var(--frost));
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 3px var(--surface-raised), var(--shadow-soft); flex: none;
  }
  .brand-badge svg{ width:24px; height:24px; }
  .brand-text .name{ font-size: 22px; font-weight:600; letter-spacing:0.5px; line-height:1.1; }
  .brand-text .sub{ font-size:12.5px; color: var(--ink-muted); letter-spacing:0.4px; margin-top:3px; }
  .nameplate-right{ display:flex; align-items:center; gap:10px; position:relative; flex-wrap:wrap; }
  .status-chip{ display:flex; align-items:center; gap:7px; background: var(--surface-raised); border:1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-size:12.5px; color:var(--ink-muted); box-shadow: var(--shadow-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; }
  .dot.pulse{ animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .theme-toggle{ display:flex; align-items:center; gap:6px; background: var(--surface-raised); border:1px solid var(--border); border-radius:999px; padding:5px; box-shadow: var(--shadow-soft); }
  .theme-toggle button{ border:none; background:transparent; color:var(--ink-muted); width:30px; height:30px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .theme-toggle button.active{ background: var(--brass-soft); color: var(--brass-ink); }

  .arch-nav{ margin: 18px 0 26px; display:flex; align-items:stretch; gap:10px; flex-wrap: wrap; background: var(--surface-inset); border:1px solid var(--border); border-radius: var(--radius-l); padding:10px; box-shadow: inset 0 1px 4px rgba(0,0,0,0.08); }
  .arch-node{ flex:1 1 190px; min-width:170px; border:1px solid transparent; border-radius: var(--radius-m); padding:12px 14px; display:flex; align-items:center; gap:11px; text-decoration:none; color: var(--ink-muted); }
  .arch-node .idx{ font-family: var(--font-mono); font-size:11px; color: var(--ink-faint); width:24px; height:24px; border-radius:50%; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex:none; }
  .arch-node .txt{ display:flex; flex-direction:column; gap:2px; }
  .arch-node .t1{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .arch-node .t2{ font-size:11px; color:var(--ink-faint); }
  .arch-node.current{ background: var(--surface-raised); box-shadow: var(--shadow-raised); }
  .arch-node.current .idx{ background: var(--brass); border-color: var(--brass); color: var(--surface-raised); }
  .arch-node.link{ cursor:pointer; }
  .arch-node.link:hover{ background: var(--surface-raised); }
  .arch-node.link:hover .t1{ color: var(--frost); }
  .arch-flow{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding: 4px 4px; flex: 0 0 auto; color: var(--ink-faint); min-width:64px; }
  .arch-flow .arrow{ font-size:15px; }
  .arch-flow small{ font-size:9.5px; text-align:center; line-height:1.25; }

  .footer-note{ text-align:center; color: var(--ink-faint); font-size:11.5px; margin-top: 22px; }

  /* ---------- wall-mounted touch panel shell (bezel follows page theme) ---------- */
  .panel-stage{ display:flex; justify-content:center; padding: 6px 0 10px; }
  .wallpanel{ width:100%; max-width: 980px; background: linear-gradient(155deg, var(--surface-inset), var(--surface-sunken)); border-radius: 30px; padding: 16px; box-shadow: var(--shadow-raised); position:relative; border:1px solid var(--border-strong); }
  .wallpanel::before, .wallpanel::after{ content:""; position:absolute; width:7px; height:7px; border-radius:50%; background: var(--ink-faint); opacity:0.4; top:9px; }
  .wallpanel::before{ left:16px; }
  .wallpanel::after{ right:16px; }
  .wallpanel-cam{ position:absolute; top:8px; left:50%; transform:translateX(-50%); width:8px; height:8px; border-radius:50%; background:#000; opacity:0.3; }

  /* the physical panel's own display: a fixed dark glass surface, independent of the
     page's light/dark theme -- like a real device screen, so every color below this
     point is a literal hex value on purpose, never a --token */
  .hp-screen{
    background: #0d1a15; border-radius: 18px; overflow:hidden; position:relative;
    display:flex; min-height: 600px; color:#eef2ec;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  @media (max-width:680px){ .hp-screen{ flex-direction:column; min-height:0; } }

  .hp-sidebar{ flex:0 0 78px; background:#0a1511; border-right:1px solid rgba(255,255,255,0.07); display:flex; flex-direction:column; align-items:stretch; padding:14px 8px; gap:4px; }
  @media (max-width:680px){ .hp-sidebar{ flex-direction:row; border-right:none; border-bottom:1px solid rgba(255,255,255,0.07); padding:8px; overflow-x:auto; } }
  .hp-navbtn{ background:transparent; border:none; color:#8fa39a; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:12px; cursor:pointer; font-size:10.5px; flex:1 1 auto; }
  .hp-navbtn .ni{ font-size:19px; line-height:1; }
  .hp-navbtn[aria-pressed="true"]{ background: rgba(214,169,95,0.16); color:#f0d9ab; }
  .hp-navbtn:hover{ color:#eef2ec; }

  .hp-content{ flex:1; min-width:0; padding: 18px 20px 22px; overflow-y:auto; max-height: 760px; }
  @media (max-width:680px){ .hp-content{ max-height:none; } }

  .hp-topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .hp-topbar .home-name{ font-size:13.5px; font-weight:600; color:#eef2ec; }
  .hp-topbar .home-sub{ font-size:10.5px; color:#7f9189; margin-top:2px; }
  .hp-bell{ width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:13px; color:#c9d4cd; flex:none; position:relative; }
  .hp-bell .bd{ position:absolute; top:-2px; right:-2px; width:8px; height:8px; border-radius:50%; background:#e57a5c; border:2px solid #0d1a15; }

  .hp-row2{ display:grid; grid-template-columns: 1.1fr 1fr; gap:12px; margin-bottom:14px; }
  @media (max-width:560px){ .hp-row2{ grid-template-columns:1fr; } }
  .hp-card{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:14px 16px; }
  .hp-clock{ font-family: var(--font-display); font-size:34px; font-weight:600; line-height:1; }
  .hp-date{ font-size:11px; color:#8fa39a; margin-top:5px; }
  .hp-loc{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:#c9d4cd; margin-top:12px; }
  .hp-wxrow{ display:flex; gap:16px; margin-top:8px; }
  .hp-wxrow .wi{ font-size:10px; color:#7f9189; }
  .hp-wxrow .wv{ font-size:14.5px; font-weight:600; margin-top:2px; }
  .hp-pill{ display:inline-block; font-size:9.5px; padding:2px 7px; border-radius:999px; margin-top:3px; }
  .hp-pill.good{ background:rgba(92,196,140,0.18); color:#7fdba8; }
  .hp-pill.warn{ background:rgba(227,181,68,0.18); color:#f0cd7c; }
  .hp-pill.crit{ background:rgba(229,122,92,0.18); color:#f2a488; }
  .hp-aqi-title{ font-size:11px; color:#8fa39a; margin-bottom:10px; }
  .hp-aqi-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .hp-aqi-cell .av{ font-size:16px; font-weight:600; font-family: var(--font-mono); }
  .hp-aqi-cell .al{ font-size:9.5px; color:#7f9189; margin-top:2px; }

  .hp-devgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  @media (max-width:560px){ .hp-devgrid{ grid-template-columns:repeat(2,1fr); } }
  .hp-devtile{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:11px 12px; display:flex; align-items:flex-start; justify-content:space-between; gap:6px; cursor:pointer; text-align:left; color:inherit; }
  .hp-devtile .di{ font-size:16px; }
  .hp-devtile .dn{ font-size:11.5px; margin-top:7px; color:#dce6e0; }
  .hp-devtile .ds{ font-size:9.5px; color:#7f9189; margin-top:2px; }
  .hp-devtile[data-on="true"] .ds{ color:#f0d9ab; }
  .hp-devtoggle{ width:22px; height:22px; border-radius:50%; border:1px solid rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:10px; color:#8fa39a; flex:none; }
  .hp-devtile[data-on="true"] .hp-devtoggle{ background:#d6a95f; border-color:#d6a95f; color:#20160a; }

  .hp-sectitle{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .hp-sectitle h3{ font-size:12px; font-weight:600; color:#dce6e0; margin:0; }

  .hp-floortabs{ display:flex; gap:6px; }
  .hp-floortab{ border:1px solid rgba(255,255,255,0.14); background:transparent; color:#8fa39a; padding:5px 12px; border-radius:999px; font-size:11px; cursor:pointer; }
  .hp-floortab[aria-pressed="true"]{ background:#7fc2d6; border-color:#7fc2d6; color:#06232a; }

  .hp-roomrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:6px; }
  @media (max-width:680px){ .hp-roomrow{ grid-template-columns:repeat(2,1fr); } }
  .hp-roomcard{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:12px; cursor:pointer; color:inherit; text-align:left; }
  .hp-roomcard:hover{ border-color:rgba(214,169,95,0.4); }
  .hp-roomcard .ri{ font-size:16px; }
  .hp-roomcard .rn{ font-size:11.5px; margin-top:8px; color:#dce6e0; }
  .hp-roomcard .rt{ font-family: var(--font-mono); font-size:15px; font-weight:600; margin-top:3px; }
  .hp-roomcard[data-on="false"] .rt{ color:#7f9189; }
  .hp-roomcard .rp{ width:16px; height:16px; border-radius:50%; float:right; border:1px solid rgba(255,255,255,0.18); }
  .hp-roomcard[data-on="true"] .rp{ background:#5cc48c; border-color:#5cc48c; }

  .hp-scenebar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.08); }
  .hp-scenebtn{ border:1px solid rgba(255,255,255,0.16); background:transparent; color:#c9d4cd; padding:8px 14px; border-radius:12px; font-size:11.5px; cursor:pointer; }
  .hp-scenebtn[aria-pressed="true"]{ background:#7fc2d6; border-color:#7fc2d6; color:#06232a; font-weight:600; }
  .hp-carbon{ margin-left:auto; display:flex; gap:16px; font-size:10.5px; color:#8fa39a; }
  .hp-carbon b{ color:#dce6e0; font-family: var(--font-mono); font-weight:600; }

  /* room detail */
  .hp-backbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .hp-backbtn{ width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#dce6e0; cursor:pointer; }
  .hp-roomtabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .hp-roomtab{ border:1px solid rgba(255,255,255,0.14); background:transparent; color:#8fa39a; padding:5px 11px; border-radius:999px; font-size:11px; cursor:pointer; }
  .hp-roomtab[aria-pressed="true"]{ background:rgba(214,169,95,0.2); border-color:#d6a95f; color:#f0d9ab; }

  .hp-detail{ display:grid; grid-template-columns: 1fr 2fr 1fr; gap:14px; align-items:start; }
  @media (max-width:820px){ .hp-detail{ grid-template-columns:1fr; } }
  .hp-stat-tile{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:14px; margin-bottom:10px; }
  .hp-stat-tile .sv{ font-family: var(--font-mono); font-size:20px; font-weight:600; }
  .hp-stat-tile .sl{ font-size:10.5px; color:#8fa39a; margin-top:4px; }

  .hp-accard{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:16px; }
  .hp-acrow1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hp-pwrbtn{ width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.18); background:transparent; color:#8fa39a; font-size:14px; cursor:pointer; }
  .hp-pwrbtn[aria-pressed="true"]{ background:#5cc48c; border-color:#5cc48c; color:#06231a; }
  .hp-modebtn{ border:1px solid rgba(255,255,255,0.16); background:transparent; color:#c9d4cd; padding:7px 13px; border-radius:11px; font-size:11.5px; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .hp-modebtn[aria-pressed="true"]{ background:#d6a95f; border-color:#d6a95f; color:#20160a; }
  .hp-settemp{ text-align:center; margin:20px 0 8px; }
  .hp-settemp .v{ font-family: var(--font-display); font-size:52px; font-weight:600; }
  .hp-settemp .l{ font-size:10.5px; color:#8fa39a; margin-top:2px; }
  .hp-ticks{ display:flex; justify-content:center; align-items:flex-end; gap:9px; margin:10px 0 18px; }
  .hp-tick{ width:2px; height:10px; background:rgba(255,255,255,0.2); border-radius:1px; }
  .hp-tick.active{ height:20px; width:3px; background:#d6a95f; }
  .hp-tick-lbl{ font-size:8.5px; color:#7f9189; margin-top:5px; text-align:center; }
  .hp-fanrow{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .hp-fanrow input[type="range"]{ flex:1; accent-color:#7fc2d6; }
  .hp-autobtn{ width:34px; height:34px; border-radius:10px; border:1px solid rgba(255,255,255,0.16); background:transparent; color:#8fa39a; cursor:pointer; font-size:12px; }
  .hp-autobtn[aria-pressed="true"]{ background:#7fc2d6; border-color:#7fc2d6; color:#06232a; }

  .hp-shortcuts{ display:flex; flex-direction:column; gap:10px; }
  .hp-shortcut{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:14px; padding:13px; text-align:center; cursor:pointer; color:#c9d4cd; font-size:11.5px; }
  .hp-shortcut .si{ font-size:17px; display:block; margin-bottom:6px; }
  .hp-shortcut[aria-pressed="true"]{ background:rgba(214,169,95,0.16); border-color:#d6a95f; color:#f0d9ab; }

  /* scenes tab */
  .hp-scene-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (max-width:560px){ .hp-scene-grid{ grid-template-columns:1fr; } }
  .hp-scenecard{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:16px; display:flex; align-items:center; gap:12px; }
  .hp-scenecard .sci{ width:40px; height:40px; border-radius:12px; background:rgba(214,169,95,0.14); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
  .hp-scenecard .scn{ font-size:13px; font-weight:600; color:#eef2ec; }
  .hp-scenecard .scd{ font-size:10.5px; color:#8fa39a; margin-top:3px; }
  .hp-runbtn{ margin-left:auto; border:1px solid rgba(255,255,255,0.18); background:transparent; color:#dce6e0; padding:7px 13px; border-radius:10px; font-size:11px; cursor:pointer; flex:none; }
  .hp-runbtn:hover{ background:rgba(214,169,95,0.18); border-color:#d6a95f; }

  /* data tab */
  .hp-datatabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .hp-dtab{ border:1px solid rgba(255,255,255,0.16); background:transparent; color:#8fa39a; padding:6px 13px; border-radius:999px; font-size:11.5px; cursor:pointer; }
  .hp-dtab[aria-pressed="true"]{ background:#d6a95f; border-color:#d6a95f; color:#20160a; }
  .hp-selrow{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .hp-sel{ background:#132119; border:1px solid rgba(255,255,255,0.14); color:#dce6e0; font-size:11px; padding:6px 10px; border-radius:9px; }
  .hp-chartcard{ background:#132119; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:14px; }
  .hp-legend{ display:flex; gap:14px; font-size:10.5px; color:#c9d4cd; margin-bottom:8px; }
  .hp-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .hp-legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* electricity meter (data tab) */
  .hp-erange{ display:flex; gap:6px; margin-bottom:12px; }

    { key:'sleep',  icon:'🌙', name:'睡眠模式',  desc:'卧室 23℃ · 儿童房 24℃',      rooms:[['master',23],['kids',24]] },

  ];

  var faqs = [
    { q:'机组遇冷死机，无法启动', a:'1、检查电源故障断电开关；2、查机组电源接线是否松动或脱开电源开关，检查电源；3、查机组控制电源断路器是否跳断，查明原因后更换新熔断器。' },
    { q:'室外机结霜严重，制热效果能力严重不足', a:'检查除霜传感器是否松脱或失灵；确认化霜周期设置是否正常；清理室外机翅片积尘积雪，保证进出风通畅。' },
    { q:'整机瘫痪', a:'1、查电源故障断电开关；2、查机组电源接线松动或断开电源开关，检查电源；3、查机组控制电源断路器跳断，查明原因后更换新熔断器。' },
    { q:'压缩机堵转', a:'检查压缩机启动电容是否老化；确认系统制冷剂压力是否过高导致排气阻力过大；必要时联系专业工程师上门检测。' },
    { q:'压缩机纯电机烧毁', a:'该故障需专业维修人员现场检测处理，请勿自行拆解，建议立即预约上门服务。' },
    { q:'通讯故障', a:'检查面板与室外机之间的通讯线是否松动；尝试断电重启面板；若仍无法恢复，请预约工程师上门排查。' }
  ];
  var repairLog = [
    { title:'地暖检修', date:'2026-09-02', status:'已完成' },
    { title:'年度保养巡检', date:'2026-06-18', status:'已完成' }
  ];

  /* ---- electricity meter (single whole-home meter, shared narrative with 业主端小程序) ---- */
  var meterReading = 12456.8;   // kWh 累计读数
  var currentPower = 2.8;       // kW 实时功率
  var monthUsage = 286;         // kWh 本月已用
  var monthCost = 214.5;        // ¥ 本月预估电费
  var tariffPeriods = [
    { key:'peak',   label:'峰段', time:'08:00–11:00, 18:00–21:00', rate:1.20, hours:[8,9,10,18,19,20] },
    { key:'flat',   label:'平段', time:'11:00–18:00, 21:00–23:00', rate:0.68, hours:[11,12,13,14,15,16,17,21,22] },
    { key:'valley', label:'谷段', time:'23:00–08:00',              rate:0.35, hours:[23,0,1,2,3,4,5,6,7] }
  ];
  function currentTariffPeriod(){
    var h = new Date().getHours();
    for(var i=0;i<tariffPeriods.length;i++){ if(tariffPeriods[i].hours.indexOf(h)!==-1) return tariffPeriods[i]; }
    return tariffPeriods[1];
  }
  function genEnergySeries(range){
    if(range==='day'){
      var vals=[0.4,0.35,0.3,0.3,0.35,0.5,0.9,1.6,1.9,1.7,1.3,0.9,0.85,0.8,0.85,0.95,1.1,1.6,2.1,2.3,1.9,1.2,0.7,0.5];
      var labels=['0','','','','','','6','','','','','','12','','','','','','18','','','','',''];
      return { vals:vals, labels:labels, peak:vals.map(function(_,i){ return tariffPeriods[0].hours.indexOf(i)!==-1; }), total: vals.reduce(function(a,b){return a+b;},0) };
    } else if(range==='week'){
      var vals=[22.4,19.8,24.1,26.5,21.0,18.2,23.6];
      var labels=['周一','周二','周三','周四','周五','周六','周日'];
      return { vals:vals, labels:labels, peak:vals.map(function(){return false;}), total: vals.reduce(function(a,b){return a+b;},0) };
    } else {
      var vals=[]; for(var i=0;i<30;i++){ vals.push(Math.round((20+Math.sin(i/30*Math.PI*2)*4+(i%7<2?4:0))*10)/10); }
      var labels=vals.map(function(_,i){ return ((i+1)%5===0) ? String(i+1) : ''; });
      return { vals:vals, labels:labels, peak:vals.map(function(){return false;}), total: vals.reduce(function(a,b){return a+b;},0) };
    }
  }
  function drawBarChart(eg, w, h){
    var pad = { l:30, r:8, t:8, b:18 };
    var vals = eg.vals;
    var max = Math.max.apply(null, vals); if(max<=0) max=1;
    var innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
    var gap = innerW/vals.length, bw = gap*(vals.length>20?0.5:0.6);
    var gridLines = '';
    for(var g=0; g<=3; g++){
      var gy = pad.t + (g/3)*innerH; var gv = Math.round((max-(g/3)*max)*10)/10;
      gridLines += '<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(w-pad.r)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
      gridLines += '<text x="4" y="'+(gy+3)+'" font-size="8.5" fill="#7f9189" font-family="IBM Plex Mono, monospace">'+gv+'</text>';
    }
    var bars = vals.map(function(v,i){
      var bh = (v/max)*innerH; var x = pad.l+i*gap+(gap-bw)/2; var y = pad.t+innerH-bh;
      var isPeak = eg.peak[i];
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(isPeak?'#f0d9ab':'#d6a95f')+'"/>';
    }).join('');
    var labels = vals.map(function(v,i){
      if(!eg.labels[i]) return '';
      var x = pad.l+i*gap+gap/2;
      return '<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" font-size="8.5" fill="#7f9189" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+eg.labels[i]+'</text>';
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">'+gridLines+bars+labels+'</svg>';
  }

  var view = { tab:'home', floor:'1楼', roomKey:null, faqOpen:null, escalate:false, dataMetric:'temp', dataAqi:'pm25', dataFloor:'1楼', dataRoom:'living', dataRange:'近一周', dataEnergyRange:'day' };

  var tabs = [
    { key:'home',    icon:'🏠', label:'首页' },
    { key:'scenes',  icon:'▦', label:'场景' },

  function roomByKey(k){ for(var i=0;i<rooms.length;i++){ if(rooms[i].key===k) return rooms[i]; } return null; }

        '<div class="rt mono">'+(r.on? r.temp.toFixed(1)+'℃' : '已关闭')+'</div></button>';

    var scenebtns = seasonPresets.map(function(s){
      return '<button type="button" class="hp-scenebtn" data-season="'+s+'" aria-pressed="'+(s===activeSeason)+'">'+s+'</button>';

  function genSeries(base, n, amp, phase){
    var out = [];
    for(var i=0;i<n;i++){ out.push(Math.round((base + Math.sin(i/n*Math.PI*2 + (phase||0))*amp)*10)/10); }
    return out;
  }
  function drawLineChart(seriesList, w, h){
    var pad = { l:30, r:8, t:8, b:16 };
    var allVals = [].concat.apply([], seriesList.map(function(s){ return s.data; }));
    var min = Math.min.apply(null, allVals), max = Math.max.apply(null, allVals);
    if(min===max){ min-=1; max+=1; }
    var span = max-min; min -= span*0.1; max += span*0.1; span = max-min;
    var n = seriesList[0].data.length;
    var x = function(i){ return pad.l + (w-pad.l-pad.r) * (i/(n-1)); };
    var y = function(v){ return h-pad.b - (h-pad.t-pad.b) * ((v-min)/span); };
    var gridLines = '';
    for(var g=0; g<=3; g++){
      var gv = min + span*g/3; var gy = y(gv);
      gridLines += '<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(w-pad.r)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
      gridLines += '<text x="4" y="'+(gy+3)+'" font-size="8.5" fill="#7f9189" font-family="IBM Plex Mono, monospace">'+Math.round(gv)+'</text>';
    }
    var paths = seriesList.map(function(s){
      var d = s.data.map(function(v,i){ return (i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1); }).join(' ');
      return '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">'+gridLines+paths+'</svg>';
  }

  /* ---------------- root render ---------------- */
  function render(){
    var html, bind;
    if(view.tab==='home'){
      if(view.roomKey){ html = roomDetailHtml(view.roomKey); bind = function(){ bindRoomDetail(view.roomKey); }; }
      else{ html = homeHtml(); bind = bindHome; }
    } else if(view.tab==='scenes'){ html = scenesHtml(); bind = bindScenes; }
    else if(view.tab==='data'){ html = dataHtml(); bind = bindData; }
    else if(view.tab==='service'){ html = serviceHtml(); bind = bindService; }
    else{ html = meHtml(); bind = bindMe; }

    document.getElementById('hpContent').innerHTML = html;
    renderNav();
    bind();
    if(brightness!==78 || true){ var scr = document.querySelector('.hp-screen'); if(scr) scr.style.filter = 'brightness('+(0.55+brightness/100*0.55)+')'; }
  }

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function tickClock(){
    var d = new Date();
    var c = document.getElementById('hpClock');
    if(c) c.textContent = pad(d.getHours())+':'+pad(d.getMinutes());
    var dd = document.getElementById('hpDate');
    if(dd){ var days=['周日','周一','周二','周三','周四','周五','周六']; dd.textContent = '2026年9月15日 · '+days[d.getDay()]; }
  }
  setInterval(tickClock, 15000);

  render();
  tickClock();
})();
</script>
