<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暖枢管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface: #f3eee1; --surface-raised: #ffffff; --surface-sunken: #e2e7dd; --surface-inset: #d8ded1;
    --ink: #16211c; --ink-muted: #52625a; --ink-faint: #8b988e;
    --border: #d1d8c9; --border-strong: #b7c1af;
    --brass: #93641f; --brass-ink: #6e4a17; --brass-soft: #ecdcb8; --brass-soft-ink: #6e4a17;
    --frost: #2c748a; --frost-soft: #d1e7ea;
    --good: #2c7a4b; --good-soft: #d7ead9; --warn: #a4720a; --warn-soft: #f2e0b3;
    --critical: #a63a24; --critical-soft: #f4d9cd;
    --cat1: #93641f; --cat2: #2c748a; --cat3: #7a4778;
    --shadow-soft: 0 1px 2px rgba(20,30,22,0.06), 0 6px 18px -8px rgba(20,30,22,0.18);
    --shadow-raised: 0 4px 10px rgba(20,30,22,0.10), 0 16px 40px -12px rgba(20,30,22,0.28);
    --font-display: 'Oswald', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-body: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radius-s: 8px; --radius-m: 14px; --radius-l: 22px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface: #0f1c17; --surface-raised: #16261f; --surface-sunken: #0a1511; --surface-inset: #0a1511;
      --ink: #eef2ec; --ink-muted: #a3b3a8; --ink-faint: #6c7d72;
      --border: #253630; --border-strong: #34473f;
      --brass: #d6a95f; --brass-ink: #f0d9ab; --brass-soft: #3a2e17; --brass-soft-ink: #e8c98a;
      --frost: #7fc2d6; --frost-soft: #163137;
      --good: #5cc48c; --good-soft: #163728; --warn: #e3b544; --warn-soft: #3a2e10;
      --critical: #e57a5c; --critical-soft: #3a1f16;
      --cat1: #d6a95f; --cat2: #7fc2d6; --cat3: #c58fc2;
      --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px -8px rgba(0,0,0,0.5);
      --shadow-raised: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --surface: #0f1c17; --surface-raised: #16261f; --surface-sunken: #0a1511; --surface-inset: #0a1511;
    --ink: #eef2ec; --ink-muted: #a3b3a8; --ink-faint: #6c7d72;
    --border: #253630; --border-strong: #34473f;
    --brass: #d6a95f; --brass-ink: #f0d9ab; --brass-soft: #3a2e17; --brass-soft-ink: #e8c98a;
    --frost: #7fc2d6; --frost-soft: #163137;
    --good: #5cc48c; --good-soft: #163728; --warn: #e3b544; --warn-soft: #3a2e10;
    --critical: #e57a5c; --critical-soft: #3a1f16;
    --cat1: #d6a95f; --cat2: #7fc2d6; --cat3: #c58fc2;
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px -8px rgba(0,0,0,0.5);
    --shadow-raised: 0 4px 10px rgba(0,0,0,0.35), 0 20px 48px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing: border-box; }
  body{ background: var(--surface); color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; }
  .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button{ font-family: inherit; }
  select{ font-family: inherit; }
  ::selection{ background: var(--brass-soft); color: var(--brass-ink); }
  a{ color: var(--frost); }
  :focus-visible{ outline: 2px solid var(--frost); outline-offset: 2px; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .shell{ max-width: 1180px; margin: 0 auto; padding: 20px 16px 64px; }

  .nameplate{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap: wrap;
    background: linear-gradient(155deg, var(--surface-raised), var(--surface-sunken));
    border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px 24px;
    box-shadow: var(--shadow-soft); position: relative; overflow: hidden;
  }
  .nameplate::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, rgba(147,100,31,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .brandmark{ display:flex; align-items:center; gap:14px; position:relative; }
  .brand-badge{
    width:46px; height:46px; border-radius:12px;
    background: conic-gradient(from 220deg, var(--frost), var(--brass), var(--frost));
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 3px var(--surface-raised), var(--shadow-soft); flex: none;
  }
  .brand-badge svg{ width:24px; height:24px; }
  .brand-text .name{ font-size: 22px; font-weight:600; letter-spacing:0.5px; line-height:1.1; }
  .brand-text .sub{ font-size:12.5px; color: var(--ink-muted); letter-spacing:0.4px; margin-top:3px; }
  .nameplate-right{ display:flex; align-items:center; gap:10px; position:relative; flex-wrap:wrap; }
  .status-chip{ display:flex; align-items:center; gap:7px; background: var(--surface-raised); border:1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-size:12.5px; color:var(--ink-muted); box-shadow: var(--shadow-soft); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; }
  .dot.pulse{ animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .theme-toggle{ display:flex; align-items:center; gap:6px; background: var(--surface-raised); border:1px solid var(--border); border-radius:999px; padding:5px; box-shadow: var(--shadow-soft); }
  .theme-toggle button{ border:none; background:transparent; color:var(--ink-muted); width:30px; height:30px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .theme-toggle button.active{ background: var(--brass-soft); color: var(--brass-ink); }

  .arch-nav{ margin: 18px 0 26px; display:flex; align-items:stretch; gap:10px; flex-wrap: wrap; background: var(--surface-inset); border:1px solid var(--border); border-radius: var(--radius-l); padding:10px; box-shadow: inset 0 1px 4px rgba(0,0,0,0.08); }
  .arch-node{ flex:1 1 190px; min-width:170px; border:1px solid transparent; border-radius: var(--radius-m); padding:12px 14px; display:flex; align-items:center; gap:11px; text-decoration:none; color: var(--ink-muted); }
  .arch-node .idx{ font-family: var(--font-mono); font-size:11px; color: var(--ink-faint); width:24px; height:24px; border-radius:50%; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex:none; }
  .arch-node .txt{ display:flex; flex-direction:column; gap:2px; }
  .arch-node .t1{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .arch-node .t2{ font-size:11px; color:var(--ink-faint); }
  .arch-node.current{ background: var(--surface-raised); box-shadow: var(--shadow-raised); }
  .arch-node.current .idx{ background: var(--brass); border-color: var(--brass); color: var(--surface-raised); }
  .arch-node.link{ cursor:pointer; }
  .arch-node.link:hover{ background: var(--surface-raised); }
  .arch-node.link:hover .t1{ color: var(--frost); }
  .arch-flow{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding: 4px 4px; flex: 0 0 auto; color: var(--ink-faint); min-width:64px; }
  .arch-flow .arrow{ font-size:15px; }
  .arch-flow small{ font-size:9.5px; text-align:center; line-height:1.25; }

  .toast{ position: fixed; left:50%; bottom: 22px; transform: translateX(-50%) translateY(calc(100% + 40px)); visibility:hidden; background: var(--ink); color: var(--surface); padding:11px 18px; border-radius:999px; font-size:13px; box-shadow: var(--shadow-raised); transition: transform 0.25s ease; z-index:80; max-width: 90vw; text-align:center; }
  .toast.show{ transform: translateX(-50%) translateY(0); visibility:visible; }

  .phone-stage{ display:flex; justify-content:center; padding: 10px 0 30px; }
  .phone{ width: 100%; max-width: 390px; background: var(--surface-raised); border-radius: 42px; border:1px solid var(--border); box-shadow: var(--shadow-raised); padding: 14px 14px 14px; position:relative; }
  .phone-notch{ width:110px; height:22px; background: var(--surface-inset); border-radius:0 0 16px 16px; margin: 0 auto 6px; }
  .phone-status{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); padding:0 8px 8px; font-family: var(--font-mono); }
  /* 固定为真实手机屏幕比例（约 390×844 去掉状态栏），各页面尺寸一致，内容在屏幕内滚动 */
  .phone-screen{ background: var(--surface-sunken); border-radius: 26px; height: min(720px, calc(100svh - 150px)); min-height: 520px; display:flex; flex-direction:column; overflow:hidden; }
  .screen-body{ flex:1; min-height:0; padding: 14px 14px 10px; overflow-y:auto; overscroll-behavior: contain; scrollbar-width: thin; }


  .weather-card{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:12px 14px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:11.5px; }
  .weather-card .wloc{ color:var(--ink-faint); display:flex; align-items:center; gap:4px; margin-bottom:3px; }
  .weather-card .wvals{ display:flex; gap:10px; align-items:baseline; }
  .weather-card .wvals b{ font-family:var(--font-display); font-size:16px; font-weight:600; }
  .tag{ font-size:10px; padding:2px 6px; border-radius:999px; font-weight:500; }
  .tag.good{ background:var(--good-soft); color:var(--good); }
  .tag.warn{ background:var(--warn-soft); color:var(--warn); }

  .home-hero{ background: radial-gradient(120% 140% at 20% 0%, var(--brass-soft), transparent 60%), var(--surface-raised); border-radius: var(--radius-l); padding: 18px; border:1px solid var(--border); margin-bottom:14px; }
  .home-hero .roomnow{ font-size:14px; font-weight:600; }
  .gauge-wrap{ display:flex; align-items:center; gap:16px; margin-top:12px; }
  .gauge-num{ font-family: var(--font-display); font-size:46px; font-weight:600; line-height:1; }
  .gauge-num small{ font-size:16px; font-weight:400; color: var(--ink-faint); }
  .gauge-controls{ display:flex; flex-direction:column; gap:8px; }
  .roundbtn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border-strong); background: var(--surface-raised); font-size:16px; cursor:pointer; color: var(--ink); display:flex; align-items:center; justify-content:center; }
  .roundbtn:hover{ border-color: var(--brass); }
  .mode-row{ display:flex; gap:7px; margin-top:14px; flex-wrap:wrap; }
  .mode-chip{ flex:1 1 auto; border:1px solid var(--border); background: var(--surface-sunken); color: var(--ink-muted); padding:8px 6px; border-radius: var(--radius-s); font-size:12px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .mode-chip[aria-pressed="true"]{ background: var(--frost); border-color: var(--frost); color: var(--surface-raised); }
  .mode-chip .mi{ font-size:15px; }

  .section-label{ font-size:12px; font-weight:600; color: var(--ink-muted); margin: 16px 4px 8px; display:flex; justify-content:space-between; align-items:center; }
  .scene-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:9px; }
  .scene-btn{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:12px 6px; text-align:center; cursor:pointer; font-size:11.5px; color: var(--ink-muted); }
  .scene-btn .si{ font-size:19px; display:block; margin-bottom:5px; }
  .scene-btn[aria-pressed="true"]{ background: var(--brass-soft); border-color: var(--brass); color: var(--brass-ink); }

  .room-list{ display:flex; flex-direction:column; gap:8px; }
  .room-card{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding: 10px 12px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .room-card .ri{ font-size:18px; width:30px; text-align:center; flex:none; }
  .room-card .rt{ flex:1; }
  .room-card .rn{ font-size:12.5px; font-weight:500; }
  .room-card .rv{ font-size:11px; color: var(--ink-faint); margin-top:1px; font-family: var(--font-mono); }
  .switch{ width:38px; height:22px; border-radius:999px; background: var(--surface-inset); position:relative; cursor:pointer; border:1px solid var(--border-strong); flex:none; }
  .switch::after{ content:""; position:absolute; top:1px; left:1px; width:18px; height:18px; border-radius:50%; background: var(--surface-raised); box-shadow: var(--shadow-soft); transition: left 0.15s; }
  .switch[aria-checked="true"]{ background: var(--good); border-color: var(--good); }
  .switch[aria-checked="true"]::after{ left:17px; }
  .room-card.off .rn, .room-card.off .ri{ opacity:0.45; }
  .room-card .chev{ color:var(--ink-faint); }

  /* 首页折叠分组 */
  .fold{ margin-top:10px; }
  .fold-head{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:11px 12px; font-family:inherit; font-size:12.5px; font-weight:600; color: var(--ink); cursor:pointer; text-align:left; }
  .fold-head .fold-meta{ display:flex; align-items:center; gap:8px; font-family: var(--font-mono); font-size:11px; font-weight:400; color: var(--ink-faint); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fold-head .fold-meta .crit{ color: var(--critical); font-weight:600; }
  .fold-chev{ flex:none; color: var(--ink-faint); font-size:14px; line-height:1; transition: transform 0.2s ease; }
  .fold-head[aria-expanded="true"] .fold-chev{ transform: rotate(90deg); }
  .fold-body{ padding-top:8px; }
  .fold-link{ width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; padding:10px 4px 2px; font-family:inherit; font-size:11.5px; color: var(--ink-muted); cursor:pointer; }
  .fold-link .mono{ color: var(--ink-faint); }
  .energy-mini{ display:flex; align-items:flex-end; gap:4px; height:52px; margin-top:6px; }
  .energy-mini .bar{ flex:1; background: linear-gradient(180deg, var(--brass), var(--brass-soft)); border-radius: 3px 3px 0 0; min-height:4px; }

  /* bottom nav */
  .bottom-nav{ display:flex; border-top:1px solid var(--border); background: var(--surface-raised); }
  .nav-btn{ flex:1; border:none; background:transparent; color:var(--ink-faint); padding:9px 4px 10px; font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .nav-btn .ni{ font-size:17px; }
  .nav-btn[aria-selected="true"]{ color: var(--brass-ink); }

  /* room detail */
  .rd-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .backbtn{ border:1px solid var(--border-strong); background:var(--surface-raised); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .rd-title{ font-size:16px; font-weight:600; }
  .rd-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .rd-stat{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:14px; text-align:center; }
  .rd-stat .v{ font-family: var(--font-display); font-size:26px; font-weight:600; }
  .rd-stat .l{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .rd-card{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-l); padding:16px; }
  .rd-target{ text-align:center; margin:10px 0; }
  .rd-target .v{ font-family:var(--font-display); font-size:38px; font-weight:600; }
  .rd-power{ width:100%; margin-top:14px; padding:10px; border-radius: var(--radius-s); border:1px solid var(--border-strong); background:var(--surface-sunken); color:var(--ink); font-size:13px; font-weight:500; cursor:pointer; }
  .rd-power[data-on="true"]{ background: var(--good-soft); color: var(--good); border-color:var(--good); }
  .rd-select{ width:100%; margin-top:10px; padding:8px 10px; border-radius: var(--radius-s); border:1px solid var(--border); background:var(--surface-sunken); color:var(--ink); font-size:13px; }

  /* scenes tab / builder */
  .scene-list-item{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .scene-list-item .si{ font-size:18px; }
  .scene-list-item .sn{ flex:1; font-size:13px; font-weight:500; }
  .scene-list-item .ssub{ font-size:10.5px; color:var(--ink-faint); }
  .addscene-btn{ width:100%; border:1px dashed var(--border-strong); background:transparent; border-radius: var(--radius-m); padding:12px; font-size:12.5px; color:var(--ink-muted); cursor:pointer; margin-top:4px; }
  .builder{ background: var(--surface-raised); border:1px solid var(--border); border-radius: var(--radius-m); padding:14px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
  .builder input[type="text"]{ width:100%; padding:8px 10px; border-radius: var(--radius-s); border:1px solid var(--border); background:var(--surface-sunken); color:var(--ink); font-size:13px; }
  .builder-room{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .builder-room input[type="number"]{ width:56px; padding:4px 6px; border-radius:6px; border:1px solid var(--border); background:var(--surface-sunken); color:var(--ink); font-family:var(--font-mono); }
  .builder-actions{ display:flex; gap:8px; justify-content:flex-end; }

  /* 按钮 */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border-strong); background: var(--surface-raised); color: var(--ink); padding:8px 14px; border-radius: var(--radius-s); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; }
  .btn.sm{ padding:6px 12px; font-size:12px; }
  .btn.primary{ background: var(--brass); border-color: var(--brass); color: var(--surface-raised); }
  .btn.primary:hover{ filter: brightness(1.06); }
  .btn.ghost{ background: transparent; color: var(--ink-muted); }
  .btn:focus-visible{ outline:2px solid var(--frost); outline-offset:2px; }

  /* ---------- 登录 · 家庭切换 · 家庭信息 · 增删家庭申请 ---------- */
  .lg-wrap .np-field{ border-bottom:none; padding:2px 0; }
  .phone-screen.logged-out .bottom-nav, .phone-screen.logged-out .help-fab{ display:none; }
  .lg-wrap{ display:flex; flex-direction:column; gap:10px; padding:18px 6px 10px; }
  .lg-brand{ display:flex; flex-direction:column; align-items:center; gap:6px; margin:12px 0 10px; text-align:center; }
  .lg-logo{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--frost), var(--brass)); box-shadow: var(--shadow-raised); }
  .lg-logo svg{ width:30px; height:30px; }
  .lg-title{ font-family: var(--font-display); font-size:22px; font-weight:600; letter-spacing:1px; }
  .lg-sub{ font-size:12px; color: var(--ink-muted); }
  .lg-code{ display:flex; gap:8px; }
  .lg-code input{ flex:1; min-width:0; }
  .lg-code button{ flex:none; border:1px solid var(--brass); background:transparent; color: var(--brass-ink); border-radius: var(--radius-s); padding:0 12px; font-size:12px; font-family:inherit; cursor:pointer; white-space:nowrap; }
  .lg-code button:disabled{ border-color: var(--border-strong); color: var(--ink-faint); cursor:default; }
  .lg-agree{ display:flex; align-items:flex-start; gap:7px; font-size:11px; color: var(--ink-muted); line-height:1.5; cursor:pointer; }
  .lg-agree input{ margin:2px 0 0; accent-color: var(--brass); }
  .lg-agree a{ color: var(--frost); text-decoration:none; }
  .lg-btn{ width:100%; padding:12px; font-size:14px; }
  .lg-or{ display:flex; align-items:center; gap:10px; font-size:10.5px; color: var(--ink-faint); margin-top:8px; }
  .lg-or::before, .lg-or::after{ content:""; flex:1; height:1px; background: var(--border); }
  .lg-wechat{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid #2aae67; background: transparent; color:#2aae67; border-radius:999px; padding:10px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; }
  .lg-wechat svg{ width:18px; height:18px; }
  .lg-demo{ width:100%; display:flex; flex-direction:column; align-items:center; gap:2px; background: var(--surface-raised); border:1px solid var(--border-strong); border-radius:999px; color: var(--ink); font-size:13px; font-weight:600; font-family:inherit; padding:9px 10px; cursor:pointer; }
  .lg-demo:hover{ border-color: var(--brass); }

  ];

  /* ============================================================ */

  var currentTab = 'home';
  var homeView = 'list'; // 'list' | roomKey | 'smart'
  var svcTab = 'tips';
  var histMetric = 'temp';
  var histAqi = 'pm25';

  var gasRange = 'day';    // 用气图表的时间范围

  /* ---- electricity meter (single whole-home meter, shared narrative with 硬件中控面板) ---- */
  var meterReading = 12456.8;   // kWh 累计读数
  var currentPower = 2.8;       // kW 实时功率
  var monthUsage = 286;         // kWh 本月已用
  var monthCost = 214.5;        // ¥ 本月预估电费
  var tariffPeriods = [
    { key:'peak',   label:'峰段', time:'08:00–11:00, 18:00–21:00', rate:1.20, hours:[8,9,10,18,19,20] },
    { key:'flat',   label:'平段', time:'11:00–18:00, 21:00–23:00', rate:0.68, hours:[11,12,13,14,15,16,17,21,22] },
    { key:'valley', label:'谷段', time:'23:00–08:00',              rate:0.35, hours:[23,0,1,2,3,4,5,6,7] }
  ];
  function currentTariffPeriod(){
    var h = new Date().getHours();
    for(var i=0;i<tariffPeriods.length;i++){ if(tariffPeriods[i].hours.indexOf(h)!==-1) return tariffPeriods[i]; }
    return tariffPeriods[1];

  /* ---- gas meter (whole-home, feeds 燃气壁挂炉 + 灶具) ---- */
  var gasReading = 3268.4;     // m³ 累计读数
  var gasFlow = 0.42;          // m³/h 实时流量
  var gasMonth = 58.6;         // m³ 本月已用

  var gasTiers = [
    { key:'t1', label:'第一档', range:'0–350 m³/年',   rate:2.61, max:350 },
    { key:'t2', label:'第二档', range:'350–500 m³/年', rate:3.13, max:500 },

  ];
  function currentGasTier(){
    for(var i=0;i<gasTiers.length;i++){ if(gasYear < gasTiers[i].max) return gasTiers[i]; }
    return gasTiers[gasTiers.length-1];
  }
  function genGasSeries(range){
    if(range==='day'){
      var heat = [0.03,0.03,0.02,0.02,0.03,0.08,0.16,0.18,0.10,0.06,0.05,0.04,0.04,0.03,0.03,0.04,0.06,0.10,0.15,0.17,0.14,0.10,0.06,0.04];
      var cook = [0,0,0,0,0,0,0.02,0.04,0,0,0,0.06,0.03,0,0,0,0,0.07,0.05,0,0,0,0,0];
      var labels=['0','','','','','','6','','','','','','12','','','','','','18','','','','',''];
      return { heat:heat, cook:cook, labels:labels, total: heat.concat(cook).reduce(function(a,b){return a+b;},0) };
    } else if(range==='week'){
      var heat=[1.6,1.4,1.7,1.9,1.5,2.0,2.1], cook=[0.25,0.22,0.26,0.28,0.24,0.42,0.45];
      return { heat:heat, cook:cook, labels:['周一','周二','周三','周四','周五','周六','周日'], total: heat.concat(cook).reduce(function(a,b){return a+b;},0) };
    } else {
      var heat=[], cook=[];
      for(var i=0;i<30;i++){ heat.push(Math.round((1.55+Math.cos(i/30*Math.PI*2)*0.35+(i%7>4?0.3:0))*100)/100); cook.push(i%7>4?0.42:0.25); }
      var labels=heat.map(function(_,i){ return ((i+1)%5===0) ? String(i+1) : ''; });
      return { heat:heat, cook:cook, labels:labels, total: heat.concat(cook).reduce(function(a,b){return a+b;},0) };
    }
  }

  function genEnergySeries(range){
    if(range==='day'){
      var vals=[0.4,0.35,0.3,0.3,0.35,0.5,0.9,1.6,1.9,1.7,1.3,0.9,0.85,0.8,0.85,0.95,1.1,1.6,2.1,2.3,1.9,1.2,0.7,0.5];
      var labels=['0','','','','','','6','','','','','','12','','','','','','18','','','','',''];
      return { vals:vals, labels:labels, unit:'kWh', peak:vals.map(function(_,i){ return tariffPeriods[0].hours.indexOf(i)!==-1; }), total: vals.reduce(function(a,b){return a+b;},0) };
    } else if(range==='week'){
      var vals=[22.4,19.8,24.1,26.5,21.0,18.2,23.6];
      var labels=['周一','周二','周三','周四','周五','周六','周日'];
      return { vals:vals, labels:labels, unit:'kWh', peak:vals.map(function(){return false;}), total: vals.reduce(function(a,b){return a+b;},0) };
    } else {
      var vals=[]; for(var i=0;i<30;i++){ vals.push(Math.round((20+Math.sin(i/30*Math.PI*2)*4+(i%7<2?4:0))*10)/10); }
      var labels=vals.map(function(_,i){ return ((i+1)%5===0) ? String(i+1) : ''; });
      return { vals:vals, labels:labels, unit:'kWh', peak:vals.map(function(){return false;}), total: vals.reduce(function(a,b){return a+b;},0) };
    }
  }

  var navBtns = document.querySelectorAll('.nav-btn');
  navBtns.forEach(function(b){
    b.addEventListener('click', function(){
      currentTab = b.getAttribute('data-tab');

  /* ============================================================ */
  /* 智能家居与安防 · 三端共享状态                                        */
  /* 同一浏览器内打开的三端页面通过 localStorage 实时同步（演示用）            */
  /* ============================================================ */
  var SH_KEY = 'nuanshu-smarthome-v1';
  function shDefault(){
    return {
      v: 3,
      lock: { name:'入户智能门锁', locked:true, doorClosed:true, battery:82 },
      cameras: [
        { id:'cam1', zone:'入户门', on:true },
        { id:'cam2', zone:'客厅', on:true },
        { id:'cam3', zone:'车库', on:true },
        { id:'cam4', zone:'花园', on:false }
      ],
      smoke: [ { id:'sm1', zone:'客厅', alarm:false }, { id:'sm2', zone:'厨房', alarm:false }, { id:'sm3', zone:'主卧', alarm:false } ],
      gas: [ { id:'gd1', zone:'厨房', alarm:false } ],
      // 窗帘开合度 pct 0–100（0 即关闭，页面不显示数值）；last 记住最近一次打开的开合度，开关一键恢复
      curtains: [ { id:'ct1', zone:'客厅', open:true, pct:60, last:60 }, { id:'ct2', zone:'主卧', open:false, pct:0, last:40 }, { id:'ct3', zone:'书房', open:true, pct:30, last:30 } ],
      // 灯光亮度 bright 0–100（0 即关闭，页面不显示数值）；last 记住最近一次打开的亮度，开关一键恢复
      lights: [
        { id:'lt1', zone:'客厅', kind:'灯带', on:true, bright:60, last:60 }, { id:'lt2', zone:'客厅', kind:'筒灯', on:true, bright:100, last:100 },
        { id:'lt3', zone:'餐厅', kind:'筒灯', on:false, bright:0, last:80 }, { id:'lt4', zone:'主卧', kind:'灯带', on:false, bright:0, last:30 },
        { id:'lt5', zone:'走廊', kind:'筒灯', on:true, bright:40, last:40 }
      ],
      events: [
        { t:'08:13', dev:'入户智能门锁', act:'检测到关门，已自动上锁', src:'门锁', lvl:'info' },
        { t:'08:12', dev:'入户智能门锁', act:'检测到开门（指纹 · 王先生）', src:'门锁', lvl:'warn' },
        { t:'07:30', dev:'客厅窗帘', act:'打开', src:'场景', lvl:'info' }
      ]
    };
  }
  function shLoad(){
    try{
      var raw = localStorage.getItem(SH_KEY);
      if(raw){
        var o = JSON.parse(raw);
        // v1 → v2：窗帘开合度由 10–90 档位改为 0–100 连续值，关闭即 0
        if(o && o.v === 1){ o.curtains.forEach(function(c){ c.last = c.pct || 60; if(!c.open) c.pct = 0; }); o.v = 2; }
        // v2 → v3：灯光由开关改为亮度 0–100，关闭即 0
        if(o && o.v === 2){ o.lights.forEach(function(l){ l.last = l.last || 80; l.bright = l.on ? l.last : 0; }); o.v = 3; }
        if(o && o.v === 3) return o;
      }
    }catch(e){}
    return shDefault();
  }
  var SH = shLoad();
  var shSubs = [];
  function shOn(fn){ shSubs.push(fn); }
  function shNow(){ var d = new Date(); return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }
  function shFind(list, id){ for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; } return null; }
  function shAlarms(){
    return SH.smoke.map(function(d){ return { d:d, kind:'smoke', name:d.zone+'烟雾报警器' }; })
      .concat(SH.gas.map(function(d){ return { d:d, kind:'gas', name:d.zone+'燃气探测器' }; }))
      .filter(function(x){ return x.d.alarm; });
  }
  function shCommit(dev, act, src, lvl){
    SH.events.unshift({ t:shNow(), dev:dev, act:act, src:src, lvl:lvl || 'info' });
    SH.events = SH.events.slice(0, 30);
    try{ localStorage.setItem(SH_KEY, JSON.stringify(SH)); }catch(e){}
    shSubs.forEach(function(f){ f(false, false); });
  }
  window.addEventListener('storage', function(e){
    if(e.key !== SH_KEY) return;
    var before = shAlarms().length;
    SH = shLoad();
    var raised = shAlarms().length > before;
    shSubs.forEach(function(f){ f(true, raised); });
  });

  function bindSmart(){

    on('shReset', function(){ shReset(SRC_APP); toast('已恢复演示初始状态'); });
    function sw(sel, fn){
      document.querySelectorAll(sel).forEach(function(el){
        el.addEventListener('click', fn);
        el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn.call(el); } });
      });
    }
    sw('[data-sh-cam]', function(){ shToggleCamera(this.getAttribute('data-sh-cam'), SRC_APP); });
    sw('[data-sh-ct]', function(){ shToggleCurtain(this.getAttribute('data-sh-ct'), SRC_APP); });
    sw('[data-sh-lt]', function(){ shToggleLight(this.getAttribute('data-sh-lt'), SRC_APP); });

      var id = r.getAttribute('data-sh-bright');
      r.addEventListener('input', function(){
        var v = +r.value;
        r.style.setProperty('--v', v + '%');
        r.setAttribute('aria-valuetext', lightText(v));
        document.getElementById('ltSub-'+id).textContent = lightText(v);
        var s = document.querySelector('[data-sh-lt="'+id+'"]'); if(s) s.setAttribute('aria-checked', v > 0);
      });
      r.addEventListener('change', function(){ shSetLightBright(id, +r.value, SRC_APP); });
    });
    document.querySelectorAll('[data-sh-alarm]').forEach(function(b){
      b.addEventListener('click', function(){
        var p = b.getAttribute('data-sh-alarm').split(':');
        var d = shFind(p[0] === 'smoke' ? SH.smoke : SH.gas, p[1]);
        shSetAlarm(p[0], p[1], !d.alarm, SRC_APP);

    });

      var id = r.getAttribute('data-sh-pct');

        ]},

        ]},
        { name:'安防与智能家居', items:[

          ['燃气探测器 × ' + SH.gas.length, gasAlarm ? 'fail' : 'ok', gasAlarm ? '正在报警，请立即确认现场' : '自检通过'],

  function reportSummary(h){
    var groups = reportGroups(h), ok = 0, warn = 0, fail = 0;
    groups.forEach(function(g){ g.items.forEach(function(it){ if(it[1] === 'ok') ok++; else if(it[1] === 'warn') warn++; else fail++; }); });
    return { groups:groups, ok:ok, warn:warn, fail:fail, total:ok + warn + fail, score:Math.max(60, 100 - fail * 10 - warn * 3) };
  }
  function reportTitle(){ var d = new Date(); return (d.getMonth() + 1) + ' 月系统健康报告'; }

      + '<span class="rp-t"><b>' + reportTitle() + '</b><span>' + s.total + ' 项检查 · ' + (s.fail ? s.fail + ' 项异常 · ' : '') + (s.warn ? s.warn + ' 项需关注' : '全部正常') + '</span></span><span class="chev">›</span></button>';

  var lastViewKey = '';

    var screen = document.querySelector('.phone-screen');

    screen.classList.toggle('logged-out', !session);

    if(viewKey !== lastViewKey){ body.scrollTop = 0; lastViewKey = viewKey; }
    if(!session){ body.innerHTML = loginHtml(); bindLogin(); return; }
    var home = currentHome();
    if(currentTab==='home'){
      if(homeView==='homes'){ body.innerHTML = homesHtml(); bindHomes(); }

      else if(homeView==='reqAdd' && ra){ body.innerHTML = reqAddHtml(); bindReqAdd(); }
      else if(homeView==='reqRemove' && rr){ body.innerHTML = reqRemoveHtml(); bindReqRemove(); }
      else if(homeView==='booking' && bk && home){ body.innerHTML = bookingHtml(); bindBooking(); }
      else if(homeView==='report' && home){ body.innerHTML = reportHtml(); bindReport(); }
      else if(homeView==='access' && accessHomeId && myHomes().some(function(x){ return x.id === accessHomeId; })){ body.innerHTML = accessHtml(); bindAccess(); }
      else if(!home){ homeView = 'list'; body.innerHTML = noHomeHtml(); var b = document.getElementById('hmReqAdd'); if(b) b.addEventListener('click', openReqAdd); }
      else if(!isFlagship(home)){ homeView = 'list'; body.innerHTML = homeBarHtml(home) + accessBannerHtml(home) + reportCardHtml(home) + simpleHomeHtml(home) + dealerCardHtml(home); bindHomeBar(); bindAccessBanner(); bindReportCard(); bindDealerCard(); bindSimpleHome(); }
      else if(homeView==='smart'){ body.innerHTML = smartHtml(); bindSmart(); }
      else { body.innerHTML = homeView==='list' ? homeListHtml() : roomDetailHtml(homeView); bindHome(); }
    }
    else if(currentTab==='scenes'){ if(home && !isFlagship(home)){ body.innerHTML = notFlagshipNote('场景'); } else { body.innerHTML = scenesHtml(); bindScenes(); } }
    else if(currentTab==='history'){ if(home && !isFlagship(home)){ body.innerHTML = notFlagshipNote('历史数据'); } else { body.innerHTML = historyHtml(); bindHistory(); } }

  function drawHistChart(){
    var svg = document.getElementById('histChart'); if(!svg) return;
    var W=340,H=150,padL=26,padR=6,padT=8,padB=18,innerW=W-padL-padR,innerH=H-padT-padB;
    if(histMetric==='gas'){
      var gg = genGasSeries(gasRange);
      var tot = gg.heat.map(function(v,i){ return v + gg.cook[i]; });
      var gmax = Math.max.apply(null, tot); gmax = Math.ceil(gmax*10)/10 || 1;
      var ggap = innerW/tot.length, gbw = ggap*(tot.length>20?0.55:0.6);
      var ggrid = '';
      for(var q=0; q<=2; q++){ var qy=padT+(q/2)*innerH; var qv=Math.round((gmax-(q/2)*gmax)*10)/10;
        ggrid += '<line x1="'+padL+'" y1="'+qy+'" x2="'+(padL+innerW)+'" y2="'+qy+'" stroke="var(--border)" stroke-width="1"/><text x="'+(padL-4)+'" y="'+(qy+3)+'" font-size="7.5" fill="var(--ink-faint)" text-anchor="end" font-family="var(--font-mono)">'+qv+'</text>'; }
      var gbars = tot.map(function(_, i){
        var x = padL + i*ggap + (ggap-gbw)/2;
        var hH = gg.heat[i]/gmax*innerH, hC = gg.cook[i]/gmax*innerH;
        var yH = padT + innerH - hH;
        var out = '<rect x="'+x.toFixed(1)+'" y="'+yH.toFixed(1)+'" width="'+gbw.toFixed(1)+'" height="'+hH.toFixed(1)+'" fill="var(--cat2)"><title>采暖/热水 '+gg.heat[i]+' m³</title></rect>';
        if(hC > 0){
          var yC = yH - hC - (hC > 2 ? 1 : 0);
          out += '<rect x="'+x.toFixed(1)+'" y="'+yC.toFixed(1)+'" width="'+gbw.toFixed(1)+'" height="'+Math.max(1,hC-(hC>2?0:0)).toFixed(1)+'" rx="1.5" fill="var(--cat1)"><title>炊事 '+gg.cook[i]+' m³</title></rect>';
        }
        return out;
      }).join('');
      var glabels = tot.map(function(_, i){
        if(!gg.labels[i]) return '';
        return '<text x="'+(padL+i*ggap+ggap/2).toFixed(1)+'" y="'+(H-4)+'" font-size="7.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-mono)">'+gg.labels[i]+'</text>';
      }).join('');
      svg.innerHTML = ggrid + gbars + glabels;
      return;
    }
    if(histMetric==='energy'){
      var eg = genEnergySeries(energyRange);
      var vals = eg.vals;
      var max=Math.max.apply(null,vals); if(max<=0) max=1;
      var bw=innerW/vals.length*(vals.length>20?0.5:0.6), gap=innerW/vals.length;
      var gridLines='';
      for(var g=0; g<=2; g++){ var gy=padT+(g/2)*innerH; var gv=Math.round((max-(g/2)*max)*10)/10;
        gridLines += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+innerW)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"/><text x="'+(padL-4)+'" y="'+(gy+3)+'" font-size="7.5" fill="var(--ink-faint)" text-anchor="end" font-family="var(--font-mono)">'+gv+'</text>'; }
      var bars = vals.map(function(v,i){
        var h=(v/max)*innerH; var x=padL+i*gap+(gap-bw)/2; var y=padT+innerH-h;
        var isPeak = eg.peak[i];
        return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+(isPeak?'var(--brass-ink)':'var(--cat1)')+'"/>';
      }).join('');
      var labels = vals.map(function(v,i){
        if(!eg.labels[i]) return '';
        var x = padL+i*gap+gap/2;
        return '<text x="'+x.toFixed(1)+'" y="'+(H-4)+'" font-size="7.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-mono)">'+eg.labels[i]+'</text>';
      }).join('');
      svg.innerHTML = gridLines + bars + labels;
      return;
    }
    var a, b, labelA, labelB;
    if(histMetric==='temp'){ a=histSeries.temp.indoor; b=histSeries.temp.outdoor; }
    else if(histMetric==='humidity'){ a=histSeries.humidity.indoor; b=histSeries.humidity.outdoor; }
    else {
      var base = histAqi==='pm25' ? [38,42,55,60,72,80,65,50,45,40,36,34,38,44,58,66,78,70,54,46,41,37,35,33]
        : histAqi==='co2' ? [480,500,520,560,610,640,600,560,520,500,490,480,485,505,525,565,615,645,605,565,525,505,495,485]
        : [0.12,0.14,0.16,0.18,0.2,0.22,0.19,0.16,0.14,0.13,0.12,0.11,0.12,0.14,0.16,0.18,0.2,0.22,0.19,0.16,0.14,0.13,0.12,0.11];
      a = base; b = base.map(function(v){ return v*0.65; });
    }
    var all = a.concat(b);
    var max = Math.ceil(Math.max.apply(null,all)), min = Math.floor(Math.min.apply(null,all));
    if(max===min) max+=1;
    var n=a.length, stepX=innerW/(n-1);
    function yOf(v){ return padT+innerH-((v-min)/(max-min))*innerH; }
    var gridLines='';
    for(var g=0; g<=2; g++){ var gy=padT+(g/2)*innerH; var gv=Math.round(max-(g/2)*(max-min));
      gridLines += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+innerW)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"/><text x="'+(padL-4)+'" y="'+(gy+3)+'" font-size="7.5" fill="var(--ink-faint)" text-anchor="end" font-family="var(--font-mono)">'+gv+'</text>'; }
    function line(arr, color){ var pts=arr.map(function(v,i){ return (padL+i*stepX).toFixed(1)+','+yOf(v).toFixed(1); }).join(' '); return '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'; }
    svg.innerHTML = gridLines + line(a,'var(--cat1)') + line(b,'var(--cat2)');
  }

  /* ============================================================ */
  function meHtml(){
    var home = currentHome(), pending = myRequests().filter(function(r){ return r.status === 'pending'; }).length;
    var rowBtn = ' style="width:100%;font-family:inherit;color:inherit;cursor:pointer;"';
    return '<div class="profile-card"><div class="profile-avatar"></div><div><div class="profile-name">业主 · ' + maskPhone(session.phone) + '</div>'
      + '<div class="profile-sub">' + ({ wechat:'微信登录', demo:'演示项目', sms:'手机号登录' }[session.via] || '手机号登录') + (home ? ' · 当前家庭：' + esc(home.name) : ' · 暂未绑定家庭') + '</div></div></div>'
      + '<button type="button" class="settings-row" id="meHomes"' + rowBtn + '><span>我的家庭</span><span class="rl">' + myHomes().length + ' 个' + (pending ? ' · ' + pending + ' 个申请处理中' : '') + ' ›</span></button>'
      + (home ? '<button type="button" class="settings-row" id="meAccess"' + rowBtn + '><span>服务商访问权限</span><span class="rl">' + accessLabel(home.access.level) + ' ›</span></button>' : '')
      + '<div class="settings-row"><span>消息通知</span><span class="switch" role="switch" aria-checked="true" id="notifSwitch"></span></div>'
      + '<div class="settings-row"><span>账户与安全</span><span class="rl">›</span></div>'
      + '<div class="settings-row"><span>关于暖枢</span><span class="rl">v2.4.1</span></div>'
      + '<button type="button" class="settings-row" id="meLogout"' + rowBtn + '><span style="color:var(--critical);">退出登录</span><span class="rl"></span></button>';
  }
  function bindMe(){
    document.getElementById('meHomes').addEventListener('click', function(){ goHomeView(myHomes().length ? 'homes' : 'list'); });
    document.getElementById('meLogout').addEventListener('click', logout);
    var ma = document.getElementById('meAccess'); if(ma) ma.addEventListener('click', function(){ openAccess(currentHome().id); });
    var sw = document.getElementById('notifSwitch');
    if(sw) sw.addEventListener('click', function(){ var on = sw.getAttribute('aria-checked')!=='true'; sw.setAttribute('aria-checked', on); });
  }

  render();
})();
</script>
